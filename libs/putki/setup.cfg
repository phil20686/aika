[metadata]
name = aika-putki
description = Task framework designed for time series data
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/phil20686/aika/
version = attr: aika.putki.__version__
author = Philip Stephens, Dominic Kennedy
author_email = philip.stephens@sjc.oxon.org
license = GNU LGPLv3
license_files = doc/LICENSE.rst
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Win32 (MS Windows)
    Environment :: MacOS X
    Intended Audience :: Developers
    Natural Language :: English
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Software Development :: Libraries
project_urls =
    Source = https://github.com/phil20686/aika/

[options]
packages = find_namespace:
package_dir=
    =src
platforms = any
include_package_data = True
install_requires =
    pandas>=1.1.5
    numpy
    aika-time
    aika-utilities
    attrs
    frozendict
    overrides
    networkx
    luigi;python_version<'3.12' # luigi only tested up to 3.12
python_requires = >= 3.10
setup_requires =
    setuptools_scm

[options.packages.find]
where = src

[options.extras_require]
test =
    pytest
    pytest-cov
all =
    %(test)s